# Command is the macOS equivalent of the Hyprland Super modifier.
# https://nikitabobko.github.io/AeroSpace/guide
config-version = 2
start-at-login = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
# Empty workspaces disappear once they are no longer visible.
# Number shortcuts recreate them on demand.
persistent-workspaces = []

# Focus the window under the pointer as the mouse moves.
focus-follows-mouse.enabled = true

# Move the pointer into the focused window, or monitor on empty workspaces.
on-focus-changed = [
    'move-mouse window-lazy-center || move-mouse monitor-lazy-center'
]

# Bind physical key positions, including the number row on AZERTY keyboards.
key-mapping.preset = 'qwerty'

[gaps]
inner.horizontal = 6
inner.vertical = 6
outer.left = 8
outer.right = 8
outer.top = 8
outer.bottom = 8

[mode.main.binding]
# Intercept these Command shortcuts instead of passing them to applications.
# Cross monitors in the requested direction; stop at the outer screen edges.
cmd-h = 'focus --boundaries all-monitors-outer-frame left'
cmd-j = 'focus --boundaries all-monitors-outer-frame down'
cmd-k = 'focus --boundaries all-monitors-outer-frame up'
cmd-l = 'focus --boundaries all-monitors-outer-frame right'

# Save the original window ID so focus-follows-mouse cannot change the target.
cmd-shift-h = '''exec-and-forget window_id="$(aerospace list-windows --focused --format '%{window-id}')" || exit
[ -n "$window_id" ] || exit
aerospace move --window-id "$window_id" --boundaries all-monitors-outer-frame left &&
aerospace focus --window-id "$window_id" &&
aerospace move-mouse window-lazy-center
'''
cmd-shift-j = '''exec-and-forget window_id="$(aerospace list-windows --focused --format '%{window-id}')" || exit
[ -n "$window_id" ] || exit
aerospace move --window-id "$window_id" --boundaries all-monitors-outer-frame down &&
aerospace focus --window-id "$window_id" &&
aerospace move-mouse window-lazy-center
'''
cmd-shift-k = '''exec-and-forget window_id="$(aerospace list-windows --focused --format '%{window-id}')" || exit
[ -n "$window_id" ] || exit
aerospace move --window-id "$window_id" --boundaries all-monitors-outer-frame up &&
aerospace focus --window-id "$window_id" &&
aerospace move-mouse window-lazy-center
'''
cmd-shift-l = '''exec-and-forget window_id="$(aerospace list-windows --focused --format '%{window-id}')" || exit
[ -n "$window_id" ] || exit
aerospace move --window-id "$window_id" --boundaries all-monitors-outer-frame right &&
aerospace focus --window-id "$window_id" &&
aerospace move-mouse window-lazy-center
'''

# Join the focused window with its neighbor in the requested direction.
cmd-ctrl-h = 'join-with left'
cmd-ctrl-j = 'join-with down'
cmd-ctrl-k = 'join-with up'
cmd-ctrl-l = 'join-with right'

# Move the entire focused workspace between monitors and follow it.
cmd-ctrl-alt-h = 'move-workspace-to-monitor --wrap-around prev'
cmd-ctrl-alt-l = 'move-workspace-to-monitor --wrap-around next'

# Toggle fullscreen within the current AeroSpace workspace.
cmd-alt-f = 'fullscreen'

# Previous/next workspace on the focused monitor; stop at the ends.
# cmd-alt-h also replaces macOS Hide Others.
cmd-alt-h = 'workspace prev'
cmd-alt-l = 'workspace next'
cmd-alt-1 = 'workspace 1'
cmd-alt-2 = 'workspace 2'
cmd-alt-3 = 'workspace 3'
cmd-alt-4 = 'workspace 4'
cmd-alt-5 = 'workspace 5'
cmd-alt-6 = 'workspace 6'
cmd-alt-7 = 'workspace 7'
cmd-alt-8 = 'workspace 8'
cmd-alt-9 = 'workspace 9'
cmd-alt-0 = 'workspace 10'

# Move the window to an adjacent workspace and follow it.
cmd-alt-shift-h = 'move-node-to-workspace --focus-follows-window prev'
cmd-alt-shift-l = 'move-node-to-workspace --focus-follows-window next'

# Move to a numbered workspace and follow the window.
cmd-alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
cmd-alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
cmd-alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
cmd-alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
cmd-alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
cmd-alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
cmd-alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
cmd-alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
cmd-alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'
cmd-alt-shift-0 = 'move-node-to-workspace --focus-follows-window 10'
