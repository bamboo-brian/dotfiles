command_timeout = 1000

format = """\
$hostname\
$username\
$directory\
$git_branch\
$git_state \
$git_status \
$git_metrics \
$fill\
$line_break\
$status\
$character\
"""

[status]
disabled = false

[hostname]
format = "[](bright-black)[$hostname]($style)[:](bg:bright-black)"
style = "bg:bright-black fg:bright-green"

[username]
format = "[$user]($style)[](bright-black) "
style_user = "bg:bright-black fg:cyan"

[fill]
symbol = " "

[directory]
style = "bright-blue"

[shell]
disabled = false
format = "[$indicator]($style)"
style = "bright-black"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_metrics]
disabled = false

[git_status]
disabled = true
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[golang]
format = "[$symbol($version )]($style)"

[php]
format = "[$symbol($version )]($style)"

[nodejs]
format = "[$symbol($version )]($style)"

[package]
disabled = true
